name: diag
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          set +e
          mkdir d
          jq '.searches |= map(select(.name|startswith("400")))' watch.json > w.json && mv w.json watch.json
          echo '{}' > state.json
          REPORT=1 node watch.mjs > d/full.txt 2>&1
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git checkout -q --orphan diag-out26; git rm -rfq --cached . ; git add d; git commit -qm diag; git push -qf origin diag-out26; exit 0
