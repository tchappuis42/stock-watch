name: diag
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          set +e
          mkdir d
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/144.0 Safari/537.36'
          for u in pokemon-coffret-ultra-premium-journee-30eme-anniversaire pokemon-coffret-ultra-premium-nuit-30eme-anniversaire; do
            curl -s -A "$UA" -H 'Accept-Language: fr-CH,fr;q=0.9' "https://www.400coups.ch/$u.html" > d/$u.html
            echo "== $u $(wc -c < d/$u.html)" >> d/out.txt
            grep -oiE 'id="button_cart_[0-9]+"[^>]*|data-ca-external-click-id[^>]*|ty-qty-in-stock[^<]{0,80}|ty-qty-out-of-stock[^<]{0,80}|Commande bient[^<]{0,60}|En stock[^<]{0,40}|Rupture[^<]{0,40}|Ajouter au panier[^<]{0,20}|Précommande[^<]{0,40}|Disponible[^<]{0,60}' d/$u.html | sort | uniq -c | head -20 >> d/out.txt
            sleep 6
          done
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git checkout -q --orphan diag-out22; git rm -rfq --cached . ; git add d; git commit -qm diag; git push -qf origin diag-out22; exit 0
