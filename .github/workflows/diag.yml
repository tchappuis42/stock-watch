name: diag
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/144.0 Safari/537.36'
          mkdir d; n=0
          for u in "/wp-json/wc/store/v1/products?search=pokemon&per_page=100&orderby=date&order=desc" "/wp-json/wc/store/v1/products?search=30&per_page=100" "/wp-json/wc/store/v1/products/categories?per_page=100"; do
            n=$((n+1)); curl -s -L -m 30 -A "$UA" -H 'Accept: application/json' -w "$n %{http_code} %{size_download} %{content_type}\n" -o d/$n.out "https://lepetitcaribou.ch$u" >> d/codes.txt; sleep 2
          done
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git checkout -q --orphan diag-out18; git rm -rfq --cached . ; git add d; git commit -qm diag; git push -qf origin diag-out18; exit 0
