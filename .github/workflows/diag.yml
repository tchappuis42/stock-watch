name: diag
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          set +e
          jq '.searches |= map(select(.name|startswith("Miixys")))' watch.json > w.json && mv w.json watch.json
          node watch.mjs > out.txt 2>&1
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git checkout -q --orphan diag-out2; git rm -rfq --cached . ; git add out.txt; git commit -qm diag; git push -qf origin diag-out2; exit 0
