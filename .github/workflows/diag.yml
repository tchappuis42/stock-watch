name: diag
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          set +e
          jq '.searches |= map(select(.shop=="cscart"))' watch.json > w.json && mv w.json watch.json
          start=$(date +%s); node watch.mjs > out.txt 2>&1; echo "durée $(( $(date +%s)-start )) s" >> out.txt
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git checkout -q --orphan diag-out; git rm -rfq --cached . ; git add out.txt; git commit -qm diag; git push -qf origin diag-out; exit 0
