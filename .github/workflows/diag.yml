name: diag
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/144.0 Safari/537.36'
          mkdir d
          n=0
          for u in "/wp-json/wc/store/v1/products?search=30%20ans&per_page=100" "/wp-json/wc/store/v1/products?search=30e&per_page=100" "/wp-json/wc/store/v1/products?search=pokemon&per_page=100&orderby=date&order=desc" "/produit/coffret-pokemon-ultra-premium-journee-me05-5-celebration-30-ans/" "/produit/coffret-pokemon-ultra-premium-soiree-me05-5-celebration-30-ans/"; do
            n=$((n+1)); curl -s -L -m 30 -A "$UA" -w "$n %{http_code} %{size_download} $u\n" -o d/$n.out "https://www.bdfancomics.ch$u" >> d/codes.txt; sleep 2
          done
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git checkout -q --orphan diag-out3; git rm -rfq --cached . ; git add d; git commit -qm diag; git push -qf origin diag-out3; exit 0
