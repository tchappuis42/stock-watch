name: diag
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          mkdir d
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/144.0 Safari/537.36'
          sleep 20
          curl -s -A "$UA" -H 'Accept-Language: fr-CH,fr;q=0.9' "https://www.400coups.ch/jeux-de-cartes/pokemon/?items_per_page=96&sort_by=timestamp&sort_order=desc" > d/cat.html
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git checkout -q --orphan diag-out24; git rm -rfq --cached . ; git add d; git commit -qm diag; git push -qf origin diag-out24; exit 0
