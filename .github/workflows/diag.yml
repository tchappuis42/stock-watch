name: diag
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/144.0 Safari/537.36'
          mkdir d
          curl -s -m 30 -A "$UA" -o d/cel.json "https://www.bdfancomics.ch/wp-json/wc/store/v1/products?search=celebration&per_page=100"
          for u in $(jq -r '.[]|select(.name|test("30|[Cc]elebration"))|.permalink' d/cel.json) ; do
            sleep 2
            t=$(curl -s -L -m 30 -A "$UA" "$u" | grep -oE 'Ouverture des ventes[^<]{0,80}' | head -1)
            echo "$u | $t" >> d/dates.txt
          done
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git checkout -q --orphan diag-out4; git rm -rfq --cached . ; git add d; git commit -qm diag; git push -qf origin diag-out4; exit 0
