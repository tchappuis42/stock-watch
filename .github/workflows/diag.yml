name: diag
on: workflow_dispatch
concurrency:
  group: diag-test
  cancel-in-progress: true
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - run: ls -la; echo "topic len ${#T}"
        env:
          T: ${{ secrets.NTFY_TOPIC }}
