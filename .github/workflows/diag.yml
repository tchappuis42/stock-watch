name: diag
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          set +e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/144.0 Safari/537.36'
          mkdir d
          curl -s -L -A "$UA" -H 'Accept: text/html' -H 'Accept-Language: fr-FR,fr;q=0.9' -D d/h.txt -o d/p.html -w "%{http_code} %{size_download} %{url_effective}\n" "https://www.play-in.com/fr/produit/659645/coffret-collection-ultra-premium-pokemon-30-ans-soiree-noctali-fr" > d/code.txt
          sleep 2
          curl -s -L -A "$UA" -H 'Accept: text/html' -o d/p2.html -w "%{http_code} %{size_download} %{url_effective}\n" "https://www.play-in.com/fr/produit/659645/x" >> d/code.txt
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git checkout -q --orphan diag-out12; git rm -rfq --cached . ; git add d; git commit -qm diag; git push -qf origin diag-out12; exit 0
